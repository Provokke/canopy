[workspace]
resolver = "2"
members = ["crates/canopy-ecs", "crates/canopy-app", "crates/canopy-demo", "benches-compare"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
thiserror = "2.0.18"
rayon = "1.12.0"
anyhow = "1.0.102"
proptest = "1.12.0"
trybuild = "1.0.101"
criterion = { version = "0.5.1", default-features = false }
